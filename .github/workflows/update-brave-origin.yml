name: Build Brave Origin Pacman Package & Update Repo

on:
  schedule:
    - cron: '0 6 * * *' # Check daily at 06:00 UTC
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force rebuild even if version matches'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  check-and-build:
    name: Check Upstream & Package for Arch Linux
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools zstd curl jq python3

      - name: Query Latest Upstream Brave Origin Version
        id: upstream
        run: |
          python3 - << 'PY_EOF' > upstream_info.env
          import urllib.request, json, re, sys
          req = urllib.request.Request('https://api.github.com/repos/brave/brave-browser/releases?per_page=20', headers={'User-Agent': 'Mozilla/5.0'})
          with urllib.request.urlopen(req) as resp:
              releases = json.loads(resp.read().decode())
          for r in releases:
              for a in r.get('assets', []):
                  m = re.match(r'^brave-origin-(\d+\.\d+\.\d+)-linux-amd64\.zip$', a['name'])
                  if m:
                      version = m.group(1)
                      print(f"version={version}")
                      print(f"url={a['browser_download_url']}")
                      print(f"asset_name={a['name']}")
                      print(f"tag={r['tag_name']}")
                      sys.exit(0)
          sys.exit(1)
          PY_EOF
          cat upstream_info.env >> $GITHUB_OUTPUT
          cat upstream_info.env

      - name: Check Existing Package Version in Release
        id: check_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TARGET_PKG="brave-origin-bin-${{ steps.upstream.outputs.version }}-2-x86_64.pkg.tar.zst"
          EXISTS="false"
          if gh release view repo -R "${{ github.repository }}" >/dev/null 2>&1; then
            if gh release view repo -R "${{ github.repository }}" --json assets -q ".assets[].name" | grep -qx "${TARGET_PKG}"; then
              EXISTS="true"
            fi
          fi
          echo "exists=${EXISTS}" >> $GITHUB_OUTPUT
          echo "Package ${TARGET_PKG} exists in release: ${EXISTS}"

      - name: Build Arch Linux Package & Update Repo DB
        if: ${{ inputs.force_build == true || steps.check_release.outputs.exists != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.upstream.outputs.version }}
          ZIP_URL: ${{ steps.upstream.outputs.url }}
        run: |
          BUILD_DIR="${GITHUB_WORKSPACE}/build_staging"
          ARCH_REPO="${GITHUB_WORKSPACE}/arch_repo"
          PKG_ROOT="${BUILD_DIR}/pkgroot"

          mkdir -p "${BUILD_DIR}" "${ARCH_REPO}" "${PKG_ROOT}"
          cd "${BUILD_DIR}"

          echo "Downloading upstream Brave Origin zip..."
          curl -sSL -o brave-origin.zip "${ZIP_URL}"

          echo "Extracting zip..."
          mkdir -p opt_extract
          bsdtar -xf brave-origin.zip -C opt_extract

          mkdir -p "${PKG_ROOT}/opt/brave-origin-bin" \
                   "${PKG_ROOT}/usr/share/applications" \
                   "${PKG_ROOT}/usr/share/pixmaps" \
                   "${PKG_ROOT}/usr/bin"

          cp -a opt_extract/* "${PKG_ROOT}/opt/brave-origin-bin/"
          chmod 755 "${PKG_ROOT}/opt/brave-origin-bin/brave" "${PKG_ROOT}/opt/brave-origin-bin/brave-origin" 2>/dev/null || true
          if [ -f "${PKG_ROOT}/opt/brave-origin-bin/chrome-sandbox" ]; then
            chmod 4755 "${PKG_ROOT}/opt/brave-origin-bin/chrome-sandbox"
          fi

          cp -a "${GITHUB_WORKSPACE}/brave-origin-wrapper" "${PKG_ROOT}/opt/brave-origin-bin/brave-origin-wrapper"
          chmod 755 "${PKG_ROOT}/opt/brave-origin-bin/brave-origin-wrapper"

          cp -a "${GITHUB_WORKSPACE}/brave-origin.desktop" "${PKG_ROOT}/usr/share/applications/brave-origin.desktop"

          for size in 16 24 32 48 64 128 256; do
            if [ -f "${PKG_ROOT}/opt/brave-origin-bin/product_logo_${size}.png" ]; then
              mkdir -p "${PKG_ROOT}/usr/share/icons/hicolor/${size}x${size}/apps"
              cp -a "${PKG_ROOT}/opt/brave-origin-bin/product_logo_${size}.png" \
                    "${PKG_ROOT}/usr/share/icons/hicolor/${size}x${size}/apps/brave-origin.png"
            fi
          done
          if [ -f "${PKG_ROOT}/opt/brave-origin-bin/product_logo_256.png" ]; then
            cp -a "${PKG_ROOT}/opt/brave-origin-bin/product_logo_256.png" "${PKG_ROOT}/usr/share/pixmaps/brave-origin.png"
          fi

          ln -sf /opt/brave-origin-bin/brave-origin-wrapper "${PKG_ROOT}/usr/bin/brave-origin-bin"

          # Generate .PKGINFO
          INSTALLED_SIZE=$(find "${PKG_ROOT}" -type f -exec stat -c %s {} + | awk '{s+=$1} END {print s}')
          BUILD_DATE=$(date +%s)

          cat << PKGINFO_EOF > "${PKG_ROOT}/.PKGINFO"
          pkgname = brave-origin-bin
          pkgbase = brave-origin-bin
          pkgver = ${VERSION}-2
          pkgdesc = The minimalist browser from the makers of Brave (binary release)
          url = https://brave.com/origin/download
          builddate = ${BUILD_DATE}
          packager = Aditya <aditya@local>
          size = ${INSTALLED_SIZE}
          arch = x86_64
          license = MPL2
          depend = alsa-lib
          depend = gtk3
          depend = libxss
          depend = nss
          depend = ttf-font
          optdepend = cups: Printer support
          optdepend = libgnome-keyring: Enable GNOME keyring support
          optdepend = libnotify: Native notification support
          optdepend = pipewire: WebRTC desktop sharing under Wayland
          provides = brave-origin-bin
          provides = brave-origin
          conflict = brave-origin
          PKGINFO_EOF
          sed -i 's/^[ \t]*//' "${PKG_ROOT}/.PKGINFO"

          # Generate .MTREE
          (cd "${PKG_ROOT}" && bsdtar -czf .MTREE --format=mtree --options='!all,use-set,type,uid,gid,mode,time,size,md5,sha256,link' . 2>/dev/null || true)

          # Compress Package
          PKG_FILE="brave-origin-bin-${VERSION}-2-x86_64.pkg.tar.zst"
          (cd "${PKG_ROOT}" && bsdtar -cf - .PKGINFO $([ -f .MTREE ] && echo .MTREE) opt usr | zstd -T0 -19 -f -o "${ARCH_REPO}/${PKG_FILE}")

          cd "${ARCH_REPO}"

          # Pull existing repo DB from release if present
          if gh release view repo -R "${{ github.repository }}" >/dev/null 2>&1; then
            gh release download repo -R "${{ github.repository }}" -p "custom-brave-origin.db.tar.gz" -p "custom-brave-origin.files.tar.gz" 2>/dev/null || true
          fi

          # Update Repo with Docker Archlinux
          docker run --rm -v "${ARCH_REPO}":/repo -w /repo archlinux:latest bash -c \
            "pacman -Sy --noconfirm pacman-contrib >/dev/null 2>&1 && repo-add -n -R custom-brave-origin.db.tar.gz ${PKG_FILE}"

          rm -f custom-brave-origin.db custom-brave-origin.files
          cp -f custom-brave-origin.db.tar.gz custom-brave-origin.db
          cp -f custom-brave-origin.files.tar.gz custom-brave-origin.files

          echo "Repository files updated:"
          ls -la

          # Publish to GitHub Release
          if gh release view repo -R "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload repo * -R "${{ github.repository }}" --clobber
          else
            gh release create repo * -R "${{ github.repository }}" \
              --title "Brave Origin Arch Linux Repository" \
              --notes "Automated Pacman repository for Brave Origin Browser on Arch Linux. Add this repo to /etc/pacman.conf to receive automated updates on 'pacman -Syu'."
          fi
